name: Taste Skill and Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taste-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full-site quality loop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Resolve Chrome for Taste Skill
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 -print -quit)"
          if [ -z "$chrome_path" ]; then echo "No Chrome executable found"; exit 1; fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          echo "Using Chrome: $chrome_path"
      - name: Fetch Taste Skill tools
        run: git clone --depth 1 https://github.com/Leonxlnx/taste-skill.git "$RUNNER_TEMP/taste-skill"
      - name: Run full-site browser checks
        run: node scripts/wr-browser-qa.mjs
      - name: Run Taste Skill source lint (diagnostic)
        continue-on-error: true
        run: |
          node "$RUNNER_TEMP/taste-skill/skills/taste-skill/scripts/lint.mjs" index.html wr-ui.css story-cinematic.css story-cinematic.js --json > .taste-skill-lint.json || true
          node -e "const r=require('./.taste-skill-lint.json'); console.log('Taste Skill lint scanned '+r.files+' files; FAIL=' + r.findings.filter(x=>x.level==='FAIL').length + ', WARN=' + r.findings.filter(x=>x.level==='WARN').length); for(const x of r.findings.slice(0,30)) console.log(x.level+' '+x.id+' '+x.file+':'+x.line+' '+x.message)"
      - name: Run rendered Taste Skill inspection on every page
        if: always()
        id: inspect
        continue-on-error: true
        run: |
          mkdir -p .taste-skill/inspect
          inspector="$RUNNER_TEMP/taste-skill/skills/taste-skill/scripts/inspect.mjs"
          failures=0
          for page in ./*.html; do
            [ -f "$page" ] || continue
            page="${page#./}"
            slug=$(basename "$page" .html | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')
            out=".taste-skill/inspect/$slug"
            mkdir -p "$out"
            echo "::group::Taste Skill inspect — $page"
            set +e
            node "$inspector" "$page" --out "$out" --widths 1440,768,390 --allow gradient --json > "$out/console.json"
            code=$?
            set -e
            node -e "const fs=require('fs');const p='$out/report.json';if(!fs.existsSync(p)){console.log('No report generated');process.exit(1)}const r=JSON.parse(fs.readFileSync(p));const f=r.findings.filter(x=>x.level==='FAIL');const w=r.findings.filter(x=>x.level==='WARN');console.log('$page: '+f.length+' FAIL, '+w.length+' WARN');for(const x of [...f,...w])console.log(x.level+' ['+x.id+'] @'+x.width+'px '+x.message)"
            [ "$code" -eq 0 ] || failures=$((failures+1))
            echo "::endgroup::"
          done
          echo "Inspector pages with FAIL findings: $failures"
          echo "inspector_failure_pages=$failures" >> "$GITHUB_OUTPUT"
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste-skill-browser-evidence
          path: |
            .taste-skill/browser
            .taste-skill/inspect
            .taste-skill-lint.json
          if-no-files-found: warn
          retention-days: 14
      - name: Quality gate summary
        if: always()
        run: |
          echo "### WR website quality check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser QA checks every HTML page at 1440px, 768px and 390px." >> "$GITHUB_STEP_SUMMARY"
          echo "- Taste Skill inspector outputs screenshots and JSON reports for every page." >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the `taste-skill-browser-evidence` artifact to view screenshots and critique them." >> "$GITHUB_STEP_SUMMARY"
          echo "- Cobalt shader gradients are the one intentionally allowed brand exception." >> "$GITHUB_STEP_SUMMARY"
